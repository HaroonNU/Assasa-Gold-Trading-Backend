services:
  - type: web
    name: asasa-gold-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Add after the frontend is deployed, so CORS allows it:
      # - key: Cors__AllowedOrigins__0
      #   value: https://<your-project>.vercel.app
